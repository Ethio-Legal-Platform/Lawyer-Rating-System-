<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Federal Court System</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    body { background: var(--cream-50); }
    .dash-layout { display: grid; grid-template-columns: 16rem 1fr; gap: 1.5rem; max-width: 82rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    @media (max-width: 900px) { .dash-layout { grid-template-columns: 1fr; } }
    .nav-item {
      display: flex; align-items: center; gap: .75rem; padding: .65rem .875rem; border-radius: var(--radius-md);
      font-size: .9375rem; font-weight: 500; color: var(--navy-700); cursor: pointer; border: none; background: transparent;
      width: 100%; text-align: left; transition: all var(--trans);
    }
    .nav-item:hover { background: rgba(10,15,30,.06); color: var(--navy-900); }
    .nav-item.active { background: var(--navy-800); color: white; font-weight: 600; }
    .nav-badge { margin-left: auto; background: var(--gold-500); color: var(--navy-950); font-size: .75rem; font-weight: 700; padding: .1rem .45rem; border-radius: var(--radius-full); }
    .nav-item.active .nav-badge { background: var(--gold-400); }
    .modal-lg { max-width: 44rem; }
    .timeline-container { position: relative; padding-left: 1.5rem; border-left: 2px solid var(--line); margin-top: 1rem; }
    .timeline-event { position: relative; margin-bottom: 1.25rem; }
    .timeline-event::before { content: ''; position: absolute; left: -1.95rem; top: .25rem; width: .75rem; height: .75rem; border-radius: 50%; background: var(--gold-500); border: 2px solid white; }
    .event-time { font-family: var(--font-mono); font-size: .75rem; color: var(--navy-700); opacity: .6; }
    .event-title { font-weight: 600; font-size: .9375rem; color: var(--navy-900); }
    .event-note { font-size: .875rem; color: var(--navy-700); opacity: .8; margin-top: .2rem; }
    .restriction-banner { background: rgba(156, 63, 46, 0.06); border: 1px solid rgba(156, 63, 46, 0.2); border-radius: var(--radius-md); padding: .75rem 1rem; font-size: .8125rem; color: var(--red-500); margin-bottom: 1rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-logo" href="/dashboard">
      <div class="navbar-logo-icon">⚖</div>
      <div>
        <div class="navbar-logo-name">Federal Court Management</div>
        <div class="navbar-logo-sub">Ministry of Justice Portal</div>
      </div>
    </a>
    <div class="navbar-spacer"></div>
    <div class="navbar-user">
      <div>
        <div class="navbar-user-name" id="user-display-name">User</div>
        <div style="text-align:right"><span class="navbar-user-role" id="user-display-role">Role</span></div>
      </div>
      <button class="navbar-btn navbar-btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
</nav>

<!-- Hero Header -->
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-row">
      <div>
        <div class="page-hero-eyebrow" id="dash-eyebrow">Court Operations</div>
        <h1 class="page-hero-title" id="dash-title">System Dashboard</h1>
        <p class="page-hero-subtitle" id="dash-subtitle">Manage cases, assignments, court dockets, and session recordings.</p>
      </div>
      <div id="hero-actions"></div>
    </div>
  </div>
</div>

<div class="dash-layout">
  <!-- Sidebar -->
  <aside>
    <div style="display:flex;flex-direction:column;gap:.375rem" id="sidebar-nav">
      <!-- Injected by JS based on role -->
    </div>
  </aside>

  <!-- Main View Area -->
  <main class="dash-main" id="main-content">
    <div class="panel">
      <div class="panel-body-padded" style="text-align:center;padding:3rem">
        <span class="spin"></span> Loading portal view...
      </div>
    </div>
  </main>
</div>

<!-- Modal Container for Details/Actions -->
<div id="modal-container" class="modal-backdrop hidden" onclick="closeModal(event)">
  <div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3 class="modal-title" id="modal-title">Case Details</h3>
        <p class="modal-subtitle" id="modal-sub">View and manage information</p>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:5001/api';
let currentUser = null;
let currentView = 'cases';
let cachedCases = [];
let cachedBranches = [];
let cachedJudges = [];
let cachedNotifications = [];

// Authentication Check
function checkAuth() {
  const stored = sessionStorage.getItem('court_user');
  if (!stored) {
    window.location.href = '/';
    return;
  }
  currentUser = JSON.parse(stored);
  document.getElementById('user-display-name').textContent = currentUser.fullName;
  document.getElementById('user-display-role').textContent = currentUser.role.toUpperCase();

  if (currentUser.role === 'filer') {
    currentView = 'my_filed_cases';
  } else if (currentUser.role === 'judge') {
    currentView = 'my_docket';
  } else if (currentUser.role === 'officer') {
    currentView = 'needs_assignment';
  } else if (currentUser.role === 'lawyer') {
    currentView = 'notifs';
  } else if (currentUser.role === 'clerk') {
    currentView = 'sessions';
  }

  renderSidebar();
  loadInitialData();
}

function logout() {
  sessionStorage.removeItem('court_user');
  window.location.href = '/';
}

function renderSidebar() {
  const role = currentUser.role;
  const nav = document.getElementById('sidebar-nav');
  let html = '';

  if (role === 'admin') {
    html = `
      <div class="dash-section-label">Admin Management</div>
      <button class="nav-item active" onclick="switchView('pending')">📥 Filed Cases <span class="nav-badge" id="badge-pending">0</span></button>
      <button class="nav-item" onclick="switchView('cases')">📂 All Cases</button>
      <button class="nav-item" onclick="switchView('lawyers')">👨‍⚖️ Registered Lawyers</button>
      <button class="nav-item" onclick="switchView('branches')">🏢 Court Branches</button>
    `;
  } else if (role === 'officer') {
    html = `
      <div class="dash-section-label">Case Assignment Officer</div>
      <button class="nav-item active" onclick="switchView('needs_assignment')">⚖️ Pending Assignment <span class="nav-badge" id="badge-assign">0</span></button>
      <button class="nav-item" onclick="switchView('cases')">📋 All Cases Registry</button>
      <button class="nav-item" onclick="switchView('judges_workload')">📊 Judge Workload</button>
    `;
  } else if (role === 'judge') {
    html = `
      <div class="dash-section-label">Judicial Bench</div>
      <button class="nav-item active" onclick="switchView('my_docket')">⚖️ Assigned Docket <span class="nav-badge" id="badge-docket">0</span></button>
      <button class="nav-item" onclick="switchView('cases')">📚 Case Archive</button>
    `;
  } else if (role === 'lawyer') {
    html = `
      <div class="dash-section-label">Lawyer Portal</div>
      <button class="nav-item active" onclick="switchView('notifs')">🔔 Case Requests <span class="nav-badge" id="badge-notifs">0</span></button>
      <button class="nav-item" onclick="switchView('my_cases')">💼 Active Representation</button>
    `;
  } else if (role === 'clerk') {
    html = `
      <div class="dash-section-label">Court Clerk / Registrar</div>
      <button class="nav-item active" onclick="switchView('sessions')">📝 Record Sessions</button>
      <button class="nav-item" onclick="switchView('cases')">📋 Court Registry</button>
    `;
  } else if (role === 'filer') {
    html = `
      <div class="dash-section-label">Litigant Portal (Temporary Account)</div>
      <button class="nav-item active" onclick="switchView('my_filed_cases')">⚖️ My Case Status</button>
      <button class="nav-item" onclick="window.location.href='/file-case'">➕ File Another Case</button>
    `;
  }

  nav.innerHTML = html;
}

function switchView(viewName) {
  currentView = viewName;
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
  event?.currentTarget?.classList.add('active');
  renderMainView();
}

async function loadInitialData() {
  try {
    const [cRes, bRes, jRes] = await Promise.all([
      fetch(`${API}/cases?role=${currentUser.role}&userId=${currentUser.id || currentUser.licenseNumber || ''}`),
      fetch(`${API}/branches`),
      fetch(`${API}/judges`)
    ]);

    cachedCases = await cRes.json();
    cachedBranches = await bRes.json();
    cachedJudges = await jRes.json();

    if (currentUser.role === 'lawyer') {
      const nRes = await fetch(`${API}/notifications?lawyerLicenseNumber=${currentUser.licenseNumber}`);
      cachedNotifications = await nRes.json();
    }

    updateBadges();
    renderMainView();
  } catch (err) {
    console.error('Data load error:', err);
  }
}

function updateBadges() {
  if (currentUser.role === 'admin') {
    const pending = cachedCases.filter(c => c.status === 'pending_review').length;
    const b = document.getElementById('badge-pending');
    if (b) b.textContent = pending;
  } else if (currentUser.role === 'officer') {
    const pending = cachedCases.filter(c => ['accepted', 'assigned_officer'].includes(c.status)).length;
    const b = document.getElementById('badge-assign');
    if (b) b.textContent = pending;
  } else if (currentUser.role === 'judge') {
    const docket = cachedCases.filter(c => c.assignedJudgeId === currentUser.id && c.status !== 'closed').length;
    const b = document.getElementById('badge-docket');
    if (b) b.textContent = docket;
  } else if (currentUser.role === 'lawyer') {
    const notifs = cachedNotifications.filter(n => n.status === 'pending').length;
    const b = document.getElementById('badge-notifs');
    if (b) b.textContent = notifs;
  }
}

function renderMainView() {
  const main = document.getElementById('main-content');
  const role = currentUser.role;

  if (currentView === 'pending' || currentView === 'needs_assignment') {
    const targetStatus = currentView === 'pending' ? ['pending_review'] : ['accepted', 'assigned_officer'];
    const filtered = cachedCases.filter(c => targetStatus.includes(c.status));
    
    main.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">${currentView === 'pending' ? '📥 New Filed Cases Pending Admin Review' : '⚖️ Cases Pending Assignment'}</h2>
          <span class="badge badge-gold">${filtered.length} pending</span>
        </div>
        <div class="panel-body-padded">
          ${filtered.length === 0 ? '<p class="panel-empty">No pending cases needing action at this stage.</p>' : renderCasesTable(filtered)}
        </div>
      </div>
    `;
  } else if (currentView === 'cases' || currentView === 'my_docket' || currentView === 'my_cases' || currentView === 'my_filed_cases') {
    let list = cachedCases;
    if (currentView === 'my_docket') list = cachedCases.filter(c => c.assignedJudgeId === currentUser.id);
    if (currentView === 'my_cases') list = cachedCases.filter(c => c.plaintiffLawyerLicense === currentUser.licenseNumber || c.defendantLawyerLicense === currentUser.licenseNumber);
    if (currentView === 'my_filed_cases') list = cachedCases.filter(c => c.filer.phone === currentUser.phone || c.caseId === currentUser.caseId);

    main.innerHTML = `
      ${role === 'filer' ? `
        <div class="alert alert-info" style="margin-bottom:1.5rem">
          <span>🔑</span>
          <div>
            <strong>Temporary Litigant Account Active:</strong> You are logged in with your phone number (<strong>${currentUser.phone}</strong>). This temporary account remains active until your case is closed. You can track status, view session records, and request a lawyer below.
          </div>
        </div>
      ` : ''}
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">${role === 'filer' ? '⚖️ My Filed Cases & Status' : '📋 Case Registry Overview'}</h2>
          <span class="badge badge-navy">${list.length} case(s)</span>
        </div>
        <div class="panel-body-padded">
          ${renderCasesTable(list)}
        </div>
      </div>
    `;
  } else if (currentView === 'judges_workload') {
    main.innerHTML = `
      <div class="restriction-banner">
        🛡️ <strong>Case Assignment Officer Authority Limits:</strong> Officers may confirm/assign appropriate branches and recommend/assign judges based on workload. Officers CANNOT alter case evidence, modify prosecutor charges, decide criminal liability, delete cases, or issue judicial orders.
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">📊 Judge Workload & Bench Capacity</h2>
        </div>
        <div class="panel-body-padded">
          <table class="data-table">
            <thead>
              <tr><th>Judge Name</th><th>Branch / Bench</th><th>Enrolled Date</th><th>Active Cases Count</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${cachedJudges.map(j => `
                <tr>
                  <td><strong>${j.fullName}</strong></td>
                  <td>${j.branch}</td>
                  <td class="mono">${j.enrolledDate}</td>
                  <td><span class="badge badge-gold">${j.activeCaseCount || 0} active</span></td>
                  <td><span class="badge badge-green">Available</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } else if (currentView === 'notifs' && role === 'lawyer') {
    const pending = cachedNotifications.filter(n => n.status === 'pending');
    main.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">🔔 Representation Requests</h2>
          <span class="badge badge-gold">${pending.length} pending</span>
        </div>
        <div>
          ${pending.length === 0 ? '<p class="panel-empty">No pending representation requests.</p>' : pending.map(n => `
            <div class="notif-card">
              <div class="notif-icon">⚖️</div>
              <div class="notif-body">
                <div class="notif-title">Client Request for Case: ${n.caseTitle} (${n.caseId})</div>
                <div class="notif-meta">Filer: <strong>${n.filerName}</strong> (${n.filerPhone}) · Side: <span class="badge badge-navy">${n.side.toUpperCase()}</span></div>
                <div class="notif-actions">
                  <button class="btn btn-gold btn-sm" onclick="respondNotif('${n.id}', 'accepted')">✓ Accept Case</button>
                  <button class="btn btn-secondary btn-sm" onclick="respondNotif('${n.id}', 'rejected')">✕ Reject</button>
                  <button class="btn btn-danger btn-sm" onclick="blockFiler('${n.id}')">🚫 Block Filer</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (currentView === 'sessions' && role === 'clerk') {
    main.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">📝 Record Court Session Events</h2>
        </div>
        <div class="panel-body-padded">
          <p style="margin-bottom:1rem;color:var(--navy-700)">Select an active court case to record session milestones and hearing events:</p>
          ${renderCasesTable(cachedCases.filter(c => ['accepted', 'assigned', 'in_progress'].includes(c.status)))}
        </div>
      </div>
    `;
  } else if (currentView === 'branches') {
    main.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">🏢 Court Branches (3 Branches Configured)</h2>
        </div>
        <div class="panel-body-padded">
          <table class="data-table">
            <thead><tr><th>Branch ID</th><th>Branch Name</th><th>Jurisdiction / Location</th><th>Case Types Handled</th></tr></thead>
            <tbody>
              ${cachedBranches.map(b => `
                <tr>
                  <td class="mono">${b.id}</td>
                  <td><strong>${b.name}</strong></td>
                  <td>${b.location}</td>
                  <td>${b.caseTypes.map(t => `<span class="badge badge-navy">${t}</span>`).join(' ')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } else if (currentView === 'lawyers') {
    fetch(`${API}/moj/verify-license/LAW-1001`).then(() => {});
    main.innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">👨‍⚖️ Verified Lawyers Registry</h2>
        </div>
        <div class="panel-body-padded">
          <p style="font-size:.875rem;color:var(--navy-700);margin-bottom:1rem">All lawyers register using their Ministry of Justice verified license.</p>
          <button class="btn btn-gold btn-sm" onclick="alert('Lawyers register directly at the login screen with license verification.')">+ Direct Lawyer Enrollment Notice</button>
        </div>
      </div>
    `;
  }
}

function renderCasesTable(cases) {
  if (!cases || cases.length === 0) return '<p class="panel-empty">No cases found in this view.</p>';
  return `
    <table class="data-table">
      <thead>
        <tr>
          <th>Case ID</th>
          <th>Case Title</th>
          <th>Type</th>
          <th>Filer / Client</th>
          <th>Branch</th>
          <th>Judge</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        ${cases.map(c => `
          <tr>
            <td class="case-id-cell">${c.caseId}</td>
            <td><strong>${c.caseTitle}</strong></td>
            <td><span class="badge badge-navy">${c.caseType}</span></td>
            <td>${c.filer.name} <br/><span style="font-size:.75rem;color:var(--navy-700);opacity:.6">${c.filer.phone}</span></td>
            <td>${getBranchName(c.assignedBranchId)}</td>
            <td>${getJudgeName(c.assignedJudgeId)}</td>
            <td><span class="badge status-${c.status}">${c.status.replace('_', ' ').toUpperCase()}</span></td>
            <td><button class="btn btn-secondary btn-sm" onclick="openCaseModal('${c.caseId}')">View / Manage →</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function getBranchName(id) {
  const b = cachedBranches.find(x => x.id === id);
  return b ? b.name : '<span style="opacity:.4">Unassigned</span>';
}
function getJudgeName(id) {
  const j = cachedJudges.find(x => x.id === id);
  return j ? j.fullName : '<span style="opacity:.4">Unassigned</span>';
}

// Case Details Modal
async function openCaseModal(caseId) {
  const c = cachedCases.find(x => x.caseId === caseId);
  if (!c) return;

  const modal = document.getElementById('modal-container');
  const title = document.getElementById('modal-title');
  const sub   = document.getElementById('modal-sub');
  const body  = document.getElementById('modal-body');

  title.textContent = `${c.caseTitle} (${c.caseId})`;
  sub.textContent   = `Type: ${c.caseType} | Jurisdiction: ${c.jurisdiction}`;

  // Fetch session timeline
  const sRes = await fetch(`${API}/sessions/${caseId}`);
  const sessions = await sRes.json();

  let roleActions = '';
  const role = currentUser.role;

  if (role === 'admin') {
    if (c.status === 'pending_review') {
      roleActions = `
        <div style="display:flex;gap:.5rem;margin-top:1rem">
          <button class="btn btn-gold btn-sm" onclick="adminAccept('${c.caseId}')">✓ Accept Case & Forward to Officer</button>
          <button class="btn btn-danger btn-sm" onclick="adminReject('${c.caseId}')">✕ Reject Case</button>
        </div>
      `;
    } else {
      roleActions = `
        <div style="display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap">
          ${!c.officialLetterSent ? `<button class="btn btn-gold btn-sm" onclick="sendOfficialLetter('${c.caseId}')">📜 Generate Summons Letter for Accused</button>` : `<span class="badge badge-green">✓ Summons Letter Issued</span>`}
        </div>
      `;
    }
  } else if (role === 'officer') {
    roleActions = `
      <div style="background:var(--cream-100);padding:1rem;border-radius:var(--radius-md);margin-top:1rem">
        <h4 style="font-weight:600;margin-bottom:.5rem">Assignment Officer Controls</h4>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Select Branch/Bench</label>
            <select class="form-select" id="assign-branch-select">
              ${cachedBranches.map(b => `<option value="${b.id}" ${c.assignedBranchId === b.id ? 'selected' : ''}>${b.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Assign / Recommend Judge</label>
            <select class="form-select" id="assign-judge-select">
              ${cachedJudges.map(j => `<option value="${j.id}" ${c.assignedJudgeId === j.id ? 'selected' : ''}>${j.fullName} (${j.branch})</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Reason / Notes for Assignment</label>
          <input class="form-input" id="assign-note" placeholder="Enter reason for assignment or change..."/>
        </div>
        <button class="btn btn-primary btn-sm" onclick="officerAssign('${c.caseId}')">Save Branch & Judge Assignment</button>
      </div>
    `;
  } else if (role === 'clerk') {
    roleActions = `
      <div style="background:var(--cream-100);padding:1rem;border-radius:var(--radius-md);margin-top:1rem">
        <h4 style="font-weight:600;margin-bottom:.5rem">📝 Record Hearing Event</h4>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Select Milestone Event</label>
            <select class="form-select" id="clerk-event-select">
              <option value="Hearing started">Hearing started</option>
              <option value="Judge present">Judge present</option>
              <option value="Prosecutor present">Prosecutor present</option>
              <option value="Accused present">Accused present</option>
              <option value="Accused absent">Accused absent</option>
              <option value="Defense lawyer present">Defense lawyer present</option>
              <option value="Witness appeared">Witness appeared</option>
              <option value="Evidence/document submitted">Evidence/document submitted</option>
              <option value="Witness testimony recorded">Witness testimony recorded</option>
              <option value="Objection raised">Objection raised</option>
              <option value="Judge issued an order">Judge issued an order</option>
              <option value="Hearing postponed">Hearing postponed</option>
              <option value="Next hearing date set">Next hearing date set</option>
              <option value="Hearing ended">Hearing ended</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Next Hearing Date (optional)</label>
            <input class="form-input" type="date" id="clerk-next-date"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Event Note / Transcript Summary</label>
          <input class="form-input" id="clerk-event-note" placeholder="Recorded notes..."/>
        </div>
        <button class="btn btn-gold btn-sm" onclick="recordClerkEvent('${c.caseId}')">Log Session Event</button>
      </div>
    `;
  } else if (role === 'judge' && c.status !== 'closed') {
    roleActions = `
      <div style="background:rgba(200,147,42,.08);border:1px solid rgba(200,147,42,.3);padding:1rem;border-radius:var(--radius-md);margin-top:1rem">
        <h4 style="font-weight:600;margin-bottom:.5rem">⚖️ Dispose Case & Rate Lawyers</h4>
        <div class="form-group">
          <label class="form-label">Final Verdict</label>
          <select class="form-select" id="judge-verdict">
            <option value="In Favor of Plaintiff / Prosecution">In Favor of Plaintiff / Prosecution</option>
            <option value="In Favor of Defendant">In Favor of Defendant</option>
            <option value="Case Dismissed">Case Dismissed</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Judge Final Statement / Judgment</label>
          <textarea class="form-textarea" id="judge-statement" placeholder="Official ruling details..."></textarea>
        </div>
        <button class="btn btn-gold btn-sm" onclick="judgeCloseCase('${c.caseId}')">⚖️ Close & Dispose Case</button>
      </div>
    `;
  }

  body.innerHTML = `
    <div>
      <div style="display:flex;gap:.5rem;margin-bottom:1rem">
        <span class="badge status-${c.status}">${c.status.toUpperCase()}</span>
        <span class="badge badge-navy">${c.caseType}</span>
        ${c.officialLetterSent ? `<span class="badge badge-green">Official Summons Sent</span>` : ''}
      </div>

      <p style="font-size:.9375rem;margin-bottom:1rem;color:var(--navy-800);line-height:1.6"><strong>Description:</strong> ${c.description}</p>
      
      <div class="form-row" style="margin-bottom:1rem">
        <div><strong>Filer:</strong> ${c.filer.name} (${c.filer.phone})</div>
        <div><strong>Location:</strong> ${c.incidentLocation || c.jurisdiction}</div>
      </div>

      ${c.client ? `<div class="alert alert-info"><strong>Client on Behalf:</strong> ${c.client.name} (${c.client.phone})</div>` : ''}

      <!-- Evidence Files -->
      <h4 style="font-weight:600;margin-top:1.25rem;margin-bottom:.5rem">📄 Encrypted Evidence Files (${c.evidenceFiles ? c.evidenceFiles.length : 0})</h4>
      <div class="file-list">
        ${(!c.evidenceFiles || c.evidenceFiles.length === 0) ? '<p style="font-size:.875rem;opacity:.5">No evidence files uploaded.</p>' : c.evidenceFiles.map(f => `
          <div class="file-item">
            <span class="file-item-icon">📄</span>
            <div class="file-item-info">
              <div class="file-item-name">${f.originalName}</div>
              <div class="file-item-meta">${(f.size/1024).toFixed(0)} KB · Uploaded ${new Date(f.uploadedAt).toLocaleDateString()}</div>
            </div>
            <span class="enc-badge">🔒 Encrypted Vault</span>
          </div>
        `).join('')}
      </div>

      <!-- Representation Status -->
      <h4 style="font-weight:600;margin-top:1.25rem;margin-bottom:.5rem">👨‍⚖️ Lawyer Representation</h4>
      <div style="font-size:.875rem;margin-bottom:1rem">
        <div>Plaintiff Lawyer: <strong>${c.plaintiffLawyerLicense || 'Not Assigned'}</strong> (${c.plaintiffLawyerStatus || 'None'})</div>
        <div>Defense Lawyer: <strong>${c.defendantLawyerLicense || 'Not Assigned'}</strong> (${c.defendantLawyerStatus || 'None'})</div>
      </div>

      <!-- Add Lawyer Action Box (Litigant/Filer only) -->
      ${role === 'filer' ? `
        <div style="background:var(--cream-100);padding:1rem;border-radius:var(--radius-md);margin-bottom:1.25rem">
          <h4 style="font-weight:600;font-size:.9375rem;margin-bottom:.5rem;color:var(--navy-900)">➕ Appoint / Request Lawyer for your Case</h4>
          <p style="font-size:.8125rem;color:var(--navy-700);opacity:.8;margin-bottom:.75rem">
            If you filed on your own and now want legal representation, enter your lawyer's MoJ License Number (e.g. <code>LAW-1001</code>). An official request &amp; SMS notice will be sent to the lawyer to accept.
          </p>
          <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label" style="font-size:.8125rem">MoJ License Number</label>
              <input class="form-input" id="add-lawyer-license-${c.caseId}" placeholder="e.g. LAW-1001" style="padding:.45rem .75rem;font-size:.875rem"/>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label" style="font-size:.8125rem">Side</label>
              <select class="form-select" id="add-lawyer-side-${c.caseId}" style="padding:.45rem .75rem;font-size:.875rem">
                <option value="plaintiff">Plaintiff / Filer Side</option>
                <option value="defendant">Defendant Side</option>
              </select>
            </div>
          </div>
          <button class="btn btn-gold btn-sm" style="margin-top:.75rem" onclick="addLawyerToCase('${c.caseId}')">
            ✉️ Send Representation Request to Lawyer
          </button>
        </div>
      ` : ''}

      ${roleActions}

      <!-- Session Timeline -->
      <h4 style="font-weight:600;margin-top:1.5rem;margin-bottom:.5rem">📜 Session Recording History</h4>
      <div class="timeline-container">
        ${sessions.length === 0 ? '<p style="font-size:.875rem;opacity:.5">No sessions recorded yet.</p>' : sessions.map(s => `
          <div class="timeline-event">
            <div class="event-time">${new Date(s.recordedAt).toLocaleString()}</div>
            <div class="event-title">${s.event}</div>
            ${s.note ? `<div class="event-note">${s.note}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
}

function closeModal(e) {
  document.getElementById('modal-container').classList.add('hidden');
}

// Actions
async function adminAccept(id) {
  await fetch(`${API}/cases/${id}/accept`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ adminNote: 'Accepted by Admin' }) });
  closeModal();
  loadInitialData();
}

async function adminReject(id) {
  await fetch(`${API}/cases/${id}/reject`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ adminNote: 'Rejected by Admin' }) });
  closeModal();
  loadInitialData();
}

async function sendOfficialLetter(id) {
  await fetch(`${API}/cases/${id}/send-official-letter`, { method: 'PUT' });
  closeModal();
  loadInitialData();
}

async function officerAssign(id) {
  const branchId = document.getElementById('assign-branch-select').value;
  const judgeId  = document.getElementById('assign-judge-select').value;
  const note     = document.getElementById('assign-note').value;

  await fetch(`${API}/cases/${id}/assign-branch`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ branchId, officerNote: note }) });
  await fetch(`${API}/cases/${id}/assign-judge`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ judgeId, note }) });

  closeModal();
  loadInitialData();
}

async function recordClerkEvent(id) {
  const event = document.getElementById('clerk-event-select').value;
  const note  = document.getElementById('clerk-event-note').value;
  const nextHearingDate = document.getElementById('clerk-next-date').value;

  await fetch(`${API}/sessions/${id}/event`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ event, note, clerkId: currentUser.id, nextHearingDate })
  });

  openCaseModal(id);
}

async function addLawyerToCase(id) {
  const licenseNumber = document.getElementById(`add-lawyer-license-${id}`).value.trim();
  const side          = document.getElementById(`add-lawyer-side-${id}`).value;
  if (!licenseNumber) {
    alert('Please enter a valid MoJ License Number (e.g. LAW-1001)');
    return;
  }
  const endpoint = side === 'plaintiff' ? 'add-plaintiff-lawyer' : 'add-defendant-lawyer';
  try {
    const res  = await fetch(`${API}/cases/${id}/${endpoint}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ licenseNumber })
    });
    const data = await res.json();
    if (res.ok) {
      alert(`Representation request sent to ${data.lawyerName} (${licenseNumber}). An SMS notification was sent to the lawyer.`);
      openCaseModal(id);
      loadInitialData();
    } else {
      alert(data.error || 'Failed to send representation request');
    }
  } catch (err) {
    alert('Error connecting to server.');
  }
}

async function judgeCloseCase(id) {
  const verdict = document.getElementById('judge-verdict').value;
  const judgeStatement = document.getElementById('judge-statement').value;

  await fetch(`${API}/cases/${id}/close`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ verdict, judgeStatement })
  });

  closeModal();
  loadInitialData();
}

async function respondNotif(id, response) {
  await fetch(`${API}/notifications/${id}/respond`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ response })
  });
  loadInitialData();
}

async function blockFiler(id) {
  await fetch(`${API}/notifications/${id}/block`, { method: 'PUT' });
  loadInitialData();
}

window.onload = checkAuth;
</script>
</body>
</html>
